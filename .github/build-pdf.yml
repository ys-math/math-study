# .github/workflows/build-pdf.yml
name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - "**.tex"
      - ".latexmkrc"      # rebuild if the build config changes too
  workflow_dispatch:

permissions:
  contents: write         # needed so the workflow can commit the PDFs back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile every topic's main.tex (upLaTeX + dvipdfmx)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: "*/main.tex"        # auto-matches every topic folder
          work_in_root_file_dir: true    # cd into each folder so \input resolves
          pre_compile: "cp .latexmkrc ~/.latexmkrc"  # make the config visible in every folder

      - name: Collect PDFs into the pdf/ folder, named by topic
        run: |
          mkdir -p pdf
          for file in */main.pdf; do
            topic="$(dirname "$file")"     # e.g. category_theory
            cp "$file" "pdf/${topic}.pdf"  # -> pdf/category_theory.pdf
          done

      - name: Commit the PDFs back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdf/
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Update compiled PDFs"
            git push
          fi