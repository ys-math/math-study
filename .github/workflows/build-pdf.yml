# .github/workflows/build-pdf.yml
name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - "**.tex"
      - ".latexmkrc"      # rebuild if the build config changes too
  workflow_dispatch:

permissions:
  contents: write         # needed so the workflow can commit the PDFs back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history so we can diff against the pushed-from commit

      - name: Work out which topics actually need rebuilding
        id: topics
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Every topic folder is one that owns a main.tex.
          ALL=()
          for f in */main.tex; do ALL+=("$(dirname "$f")"); done

          # Files that every topic depends on: touching one forces a full rebuild.
          SHARED='preamble\.tex|colophon\.tex|\.latexmkrc|\.github/workflows/build-pdf\.yml'

          rebuild_all=false
          if [ "$EVENT" != "push" ]; then
            echo "Not a push event -> rebuilding every topic."
            rebuild_all=true
          elif ! git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            echo "Base commit ${BEFORE} is unavailable (new branch or force push) -> rebuilding every topic."
            rebuild_all=true
          fi

          selected=()
          if [ "$rebuild_all" = true ]; then
            selected=("${ALL[@]}")
          else
            changed="$(git diff --name-only "$BEFORE" "$SHA")"
            echo "Changed files:"
            printf '%s\n' "$changed" | sed 's/^/  /'

            if printf '%s\n' "$changed" | grep -qxE "$SHARED"; then
              echo "A shared file changed -> rebuilding every topic."
              selected=("${ALL[@]}")
            else
              for topic in "${ALL[@]}"; do
                if printf '%s\n' "$changed" | grep -qE "^${topic}/.*\.tex$"; then
                  selected+=("$topic")
                elif [ ! -f "pdf/${topic}.pdf" ]; then
                  echo "pdf/${topic}.pdf is missing -> building ${topic} anyway."
                  selected+=("$topic")
                fi
              done
            fi
          fi

          echo "Topics to build: ${selected[*]:-(none)}"
          {
            echo "root_files<<EOF"
            for topic in ${selected[@]+"${selected[@]}"}; do
              echo "${topic}/main.tex"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile the affected topics (upLaTeX + dvipdfmx)
        if: steps.topics.outputs.root_files != ''
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.topics.outputs.root_files }}
          work_in_root_file_dir: true    # cd into each folder so \input resolves
          pre_compile: "cp $GITHUB_WORKSPACE/.latexmkrc ~/.latexmkrc"  # absolute path, works from any topic folder
          args: -pdfdvi -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Collect the freshly built PDFs into the pdf/ folder, named by topic
        if: steps.topics.outputs.root_files != ''
        run: |
          shopt -s nullglob
          mkdir -p pdf
          for file in */main.pdf; do
            topic="$(dirname "$file")"     # e.g. category_theory
            cp "$file" "pdf/${topic}.pdf"  # -> pdf/category_theory.pdf
          done

      - name: Commit the PDFs back to the repo
        if: steps.topics.outputs.root_files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdf/
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Update compiled PDFs"
            git push
          fi
