# .github/workflows/validate.yml

name: Validate

# Branches exist only for changes that can break every topic at once —
# scripts/, .github/, .latexmkrc, tex/preamble.tex, tex/colophon.tex (see
# docs/git-strategy.md). Before this workflow those were the only changes with
# no CI at all, because build-pdf.yml and update-readme.yml both run on pushes
# to main. This one runs on the PR and commits nothing.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # this workflow only reads; it never pushes

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run the script tests
        run: python -m unittest discover -s scripts -t scripts -p 'test_*.py'

  tex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Every topic, unconditionally. build-pdf.yml narrows to the topics whose
      # sources changed because it runs on every push to main and TeX Live is
      # slow; here the whole point is the shared files, which affect all of
      # them, so selecting would only ever pick everything anyway.
      - name: List every topic
        id: topics
        run: |
          set -euo pipefail
          {
            echo "root_files<<EOF"
            for f in tex/*/main.tex; do echo "$f"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile every topic (upLaTeX + dvipdfmx)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.topics.outputs.root_files }}
          work_in_root_file_dir: true    # cd into each folder so \input resolves
          pre_compile: "cp $GITHUB_WORKSPACE/.latexmkrc ~/.latexmkrc"  # absolute path, works from any topic folder
          args: -pdfdvi -file-line-error -halt-on-error -interaction=nonstopmode
